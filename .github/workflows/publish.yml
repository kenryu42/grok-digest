name: Publish Release
run-name: publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.1
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    if: github.repository == 'kenryu42/grok-digest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bind the run to the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$TAG" = "v$(jq -r .version package.json)"

      - name: Check and pack
        run: |
          bun install --frozen-lockfile
          bun run check
          mkdir package-output
          npm pack --pack-destination package-output
          cd package-output
          sha256sum ./*.tgz > SHA256SUMS

      - uses: actions/upload-artifact@v5
        with:
          name: npm-package
          path: package-output
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: npm-package
          path: package-output

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish the checked tarball
        working-directory: package-output
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$TAG"
          sha256sum --check SHA256SUMS
          if [ -n "$(npm view "grok-digest@${TAG#v}" version 2>/dev/null)" ]; then
            echo "grok-digest@${TAG#v} is already on npm."
          else
            npm publish ./*.tgz --access public --provenance
          fi

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: npm-package
          path: package-output

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" package-output/*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
